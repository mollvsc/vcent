title: Vince J
tagline: Product, technology, heavy music & photography
description: >-
  Personal site of Vince J — principal product manager writing about product
  management, reviewing heavy music, and sharing photography.
# NOTE: until the vcent.in DNS cutover happens, this site is served from
# https://mollvsc.github.io/vcent/ (a GitHub Pages project subpath), so
# baseurl must stay "/vcent". Once DNS + CNAME are confirmed working,
# switch this to "" and run: python3 scripts/set_baseurl.py ""
url: "https://vcent.in"
baseurl: "/vcent"
author: Vince J
email: me@vcent.in

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  writing:
    output: true
  music-reviews:
    output: true
  one-minute-vlogs:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: writing
    values:
      layout: writing-post
  - scope:
      path: ""
      type: music-reviews
    values:
      layout: music-review
  - scope:
      path: ""
      type: one-minute-vlogs
    values:
      layout: vlog

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - scripts
  - "Squarespace-Wordpress-Export-09-06-2026 (2).xml"
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
