---
layout: default
---
<article class="post music-review">
  <p class="post-back"><a href="{{ '/music-reviews/' | relative_url }}">&larr; Music reviews</a></p>
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    {% if page.tags.size > 0 %}
      &middot;
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% unless forloop.last %}, {% endunless %}{% endfor %}
    {% endif %}
  </p>
  <div class="post-content">
    {{ content }}
  </div>
</article>
