---
layout: default
---
<article class="post vlog">
  <p class="post-back"><a href="{{ '/one-minute-vlogs/' | relative_url }}">&larr; One-minute vlogs</a></p>
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
  </p>
  <div class="post-content">
    {{ content }}
  </div>
</article>
