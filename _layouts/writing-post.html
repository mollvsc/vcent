---
layout: default
---
<article class="post">
  <p class="post-back"><a href="{{ '/writing/' | relative_url }}">&larr; Writing</a></p>
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    {% include tag-list.html %}
  </p>
  <div class="post-content">
    {{ content }}
  </div>
</article>
